# The5ers High Stakes — transcribed 2026-10-05, verify before purchase.
firm: The5ers
program: High Stakes
verify_before_purchase: true

phases:
  - profit_target_pct: 10 # Classic: 8%
    min_trading_days: 0
    min_profitable_days: 3
    time_limit_days: null
    target_requires_flat: false
  - profit_target_pct: 5
    min_trading_days: 0
    min_profitable_days: 3
    time_limit_days: null
    target_requires_flat: false

daily_loss:
  pct: 5
  pct_of: reference # conservative: allowance scales with the reference
  reference: reset_max_balance_equity # verify; higher of balance/equity is the stricter floor
  measured_on: equity # stricter reading until verified; was balance
  reset_tz: UTC+3
  reset_time: "00:00"

max_loss:
  pct: 10
  pct_of: initial
  type: static
  trail_reference: null
  lock_at: null

consistency:
  best_day_max_pct_of_positive_days: null

news:
  evaluation_restricted: true
  funded_window_min: 2 # no execution from -2 to +2 min around high-impact news

trading_limits:
  weekend_holding: null
  max_requests_per_day: null
  min_hold_seconds: null

payout:
  split_pct: 80 # 80-100%
  split_max_pct: 100
  first_after_days: null
  cycle_days: 14

fees:
  fee_by_size: null # sirooj fills it
  fee_refund: null # unstated

banned_behaviors: null

sources:
  - {url: https://the5ers.com/faqs/what-are-the-general-rules-for-the-high-stakes-program/, accessed: "2026-10-05"}

modeled_in_sim:
  daily_loss: true
  max_loss: true
  consistency: true
  news: false
  min_hold_seconds: true
  max_requests_per_day: false
  weekend_holding: false
  payout: false
  fees: false

notes:
  - Daily loss is 5% of the prior day's closing equity or balance — verify which applies when they differ.
  - Minimum 3 profitable days — verify whether that is per phase or overall.
  - A visible stop-loss is required on every position.
  - Reset clock UTC+3 may really be MT5 server midnight (+2 winter / +3 summer, US-DST bounds); verify before purchase.
