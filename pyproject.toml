[project]
name = "srj-ventures"
version = "0.1.0"
description = "SRJ Ventures quant research loop — intraday CFD strategies for prop-firm challenges"
readme = "README.md"
requires-python = ">=3.12"
# NOTE: pytest/ruff are deliberately runtime deps so `uv run pytest` works
# out of the box on a fresh machine (see AGENTS.md definition of done).
dependencies = [
  "polars>=1.0",
  "pyarrow>=17",
  "numpy>=1.26",
  "httpx>=0.27",
  "pyyaml>=6",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "tzdata>=2024.1; sys_platform == 'win32'",  # IANA DB for zoneinfo/polars on Windows
  "pytest>=8",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
